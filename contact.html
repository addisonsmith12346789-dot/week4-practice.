<main>
  <h1>Share a Haunting</h1>

  <p>
    Have you experienced something unexplained in Virginia? 
    Share your story, recommend a haunted location, or tell us 
    about a paranormal experience.
  </p>

  <form action="#" method="post">

    <label for="name">Name</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Email Address</label>
    <input type="email" id="email" name="email" required>

    <label for="location">Haunted Location</label>
    <input type="text" id="location" name="location">

    <label for="message">Tell Us Your Story</label>
    <textarea id="message" name="message" rows="6" required></textarea>

    <button type="submit">Send Your Story</button>

  </form>
</main>
